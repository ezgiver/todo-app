# Production Docker Compose for Oracle Cloud VM deployment.
# Database is hosted on Neon (external) — no local Postgres container needed.
#
# Required env vars (set in deploy/.env):
#   DATABASE_URL  — Neon PostgreSQL connection string
#   SECRET_KEY    — Flask session secret (generate with: python -c "import secrets; print(secrets.token_hex(32))")
#   DOMAIN        — Your domain name (or VM public IP for initial testing)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      APP_CONFIG: config.ProductionConfig
      CORS_ORIGINS: ""
    expose:
      - "5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
