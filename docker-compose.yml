services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # Points at the local Postgres container.
      # For Neon/remote, override with your hosted connection string.
      DATABASE_URL: postgresql://todo_user:todo_pass@postgres:5432/todo_db
      SECRET_KEY: dev-local-compose-secret-not-for-prod
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
