# Fly.io deployment config.
# `app` must be globally unique — Fly will prompt to rename during launch if taken.
app = "todo-app-ezgiver"
primary_region = "fra"

[build]

[env]
  APP_CONFIG = "config.ProductionConfig"
  DATABASE_URL = "sqlite:////data/todo.db"
  STATIC_ROOT = "/app/static"
  # Origin is same as the app itself; CORS is a no-op in prod but keep it valid.
  CORS_ORIGINS = "https://todo-app-ezgiver.fly.dev"

[[mounts]]
  source = "todo_data"
  destination = "/data"
  initial_size = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
